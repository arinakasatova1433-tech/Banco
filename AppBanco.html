<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Banco App · Испанский для души</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        background: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
    }

    .phone {
        max-width: 440px;
        width: 100%;
        background: #f8fafc;
        border-radius: 40px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 0 10px #1e293b;
        overflow: hidden;
        position: relative;
        border: 1px solid #334155;
        display: flex;
        flex-direction: column;
        height: 92vh;
        max-height: 880px;
    }

    .notch {
        width: 140px; height: 26px;
        background: #1e293b;
        margin: 0 auto;
        border-radius: 0 0 18px 18px;
        flex-shrink: 0;
    }

    .status-bar {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 1.5rem 0.2rem;
        font-size: 0.72rem;
        color: #64748b;
        font-weight: 600;
        flex-shrink: 0;
    }

    .app-header {
        padding: 0.5rem 1.3rem 0.9rem;
        background: #ffffff;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .app-header h1 {
        font-size: 1.35rem;
        font-weight: 700;
        color: #0f172a;
    }

    .user-badge {
        background: #e2e8f0;
        padding: 0.3rem 0.8rem;
        border-radius: 30px;
        font-size: 0.78rem;
        color: #334155;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
    }

    .app-content {
        padding: 1rem 1.1rem 1.5rem;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
    }

    .app-content::-webkit-scrollbar { width: 4px; }
    .app-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .section-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #0f172a;
        margin: 1.1rem 0 0.7rem 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .section-title i { font-style: normal; font-size: 1.15rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    .card {
        border-radius: 16px;
        padding: 0.9rem 0.6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 600;
        font-size: 0.82rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        transition: transform 0.15s, box-shadow 0.15s;
        cursor: pointer;
        border: 1px solid rgba(0,0,0,0.02);
        line-height: 1.3;
        position: relative;
    }

    .card:active { transform: scale(0.97); }
    .card .icon { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .card .sub { font-weight: 400; font-size: 0.68rem; color: #475569; margin-top: 2px; }

    .card-yellow { background: #fef9c3; color: #854d0e; }
    .card-orange { background: #ffedd5; color: #9a3412; }
    .card-blue { background: #dbeafe; color: #1e40af; }
    .card-green { background: #dcfce7; color: #166534; }
    .card-pink { background: #fce7f3; color: #9d174d; }
    .card-purple { background: #ede9fe; color: #5b21b6; }
    .card-slate { background: #f1f5f9; color: #1e293b; }
    .card-red { background: #fee2e2; color: #991b1b; }

    .account-card {
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        color: white;
        border-radius: 20px;
        padding: 1rem 1.2rem;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 8px 20px rgba(30, 64, 175, 0.25);
        cursor: pointer;
        transition: transform 0.15s;
    }

    .account-card:active { transform: scale(0.98); }

    .account-card .acc-type {
        font-size: 0.75rem;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .account-card .acc-balance {
        font-size: 1.6rem;
        font-weight: 700;
    }

    .account-card .acc-balance small {
        font-size: 0.8rem;
        font-weight: 400;
        opacity: 0.8;
    }

    .account-card .acc-label {
        font-size: 0.7rem;
        opacity: 0.7;
    }

    .account-card.ahorro {
        background: linear-gradient(135deg, #047857, #10b981);
        box-shadow: 0 8px 20px rgba(4, 120, 87, 0.25);
    }

    .account-card.nomina {
        background: linear-gradient(135deg, #b45309, #f59e0b);
        box-shadow: 0 8px 20px rgba(180, 83, 9, 0.25);
    }

    .account-card.vivienda {
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
    }

    .action-list { display: flex; flex-direction: column; gap: 7px; }

    .action-item {
        background: #fff7ed;
        border-radius: 14px;
        padding: 0.85rem 1rem;
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 500;
        font-size: 0.88rem;
        color: #7c2d12;
        border-left: 5px solid #fb923c;
        cursor: pointer;
        transition: background 0.15s;
    }

    .action-item:active { background: #ffedd5; }
    .action-item .icon { font-size: 1.2rem; width: 26px; text-align: center; }

    .app-footer {
        display: flex;
        justify-content: space-around;
        padding: 0.7rem 1rem 1rem;
        background: #ffffff;
        border-top: 1px solid #f1f5f9;
        font-size: 0.62rem;
        color: #94a3b8;
        font-weight: 500;
        text-align: center;
        flex-shrink: 0;
    }

    .footer-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: pointer;
        transition: color 0.15s;
        padding: 0 0.5rem;
    }

    .footer-item.active { color: #2563eb; }
    .footer-item .icon { font-size: 1.25rem; }

    /* Модальные окна */
    .modal-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }

    .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
    }

    .modal {
        background: #ffffff;
        border-radius: 28px 28px 0 0;
        width: 100%;
        padding: 1.5rem 1.3rem 1.8rem;
        transform: translateY(30px);
        transition: transform 0.25s;
        max-height: 85%;
        overflow-y: auto;
    }

    .modal-overlay.show .modal { transform: translateY(0); }

    .modal h2 {
        font-size: 1.15rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .modal label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 0.3rem;
        margin-top: 0.8rem;
    }

    .modal input, .modal select {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 0.9rem;
        font-family: inherit;
        background: #f8fafc;
        transition: border 0.15s;
    }

    .modal input:focus, .modal select:focus {
        border-color: #3b82f6;
        outline: none;
        background: #ffffff;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 1.3rem;
    }

    .btn {
        flex: 1;
        padding: 0.8rem 1rem;
        border: none;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s, background 0.15s;
        font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
        background: #2563eb;
        color: white;
    }
    .btn-primary:hover { background: #1d4ed8; }

    .btn-secondary {
        background: #e2e8f0;
        color: #334155;
    }
    .btn-secondary:hover { background: #cbd5e1; }

    .btn-danger {
        background: #dc2626;
        color: white;
    }
    .btn-danger:hover { background: #b91c1c; }

    /* Toast */
    .toast {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 50px;
        font-size: 0.78rem;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
        z-index: 500;
        max-width: 90%;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .toast.show { opacity: 1; }

    /* История */
    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.7rem 0.8rem;
        border-bottom: 1px solid #f1f5f9;
        font-size: 0.82rem;
    }

    .history-item .desc {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .history-item .desc small { color: #94a3b8; font-size: 0.68rem; }

    .history-item .amount {
        font-weight: 700;
        font-size: 0.85rem;
    }

    .amount.positive { color: #16a34a; }
    .amount.negative { color: #dc2626; }

    .empty-state {
        text-align: center;
        color: #94a3b8;
        font-size: 0.85rem;
        padding: 2rem 1rem;
        font-style: italic;
    }

    .balance-badge {
        background: #f1f5f9;
        border-radius: 12px;
        padding: 0.6rem 0.9rem;
        font-size: 0.85rem;
        color: #334155;
        margin-bottom: 0.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .balance-badge strong { color: #0f172a; font-size: 1rem; }
</style>
</head>
<body>
<div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
        <span id="clock">9:41</span>
        <span>📶 🔋 100%</span>
    </div>

    <div class="app-header">
        <h1>🏦 Banco</h1>
        <div class="user-badge" onclick="openProfile()">
            <i>👤</i> <span id="userName">Valeria</span>
        </div>
    </div>

    <div class="app-content" id="appContent">
        <!-- Динамический контент -->
    </div>

    <div class="app-footer">
        <div class="footer-item active" data-tab="home" onclick="switchTab('home')">
            <span class="icon">🏠</span> Inicio
        </div>
        <div class="footer-item" data-tab="accounts" onclick="switchTab('accounts')">
            <span class="icon">📂</span> Cuentas
        </div>
        <div class="footer-item" data-tab="transfer" onclick="switchTab('transfer')">
            <span class="icon">🔄</span> Transferir
        </div>
        <div class="footer-item" data-tab="history" onclick="switchTab('history')">
            <span class="icon">📜</span> Historial
        </div>
        <div class="footer-item" data-tab="cards" onclick="switchTab('cards')">
            <span class="icon">💳</span> Tarjetas
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
// ==================== СОСТОЯНИЕ ====================
const STORAGE_KEY = 'banco_app_state_v1';

const defaultState = {
    user: { name: 'Valeria', loggedIn: false },
    accounts: [
        { id: 'acc1', type: 'corriente', name: 'Cuenta corriente', balance: 1250.50 },
        { id: 'acc2', type: 'ahorro', name: 'Cuenta de ahorro', balance: 3400.00 }
    ],
    cards: [
        { id: 'card1', type: 'debito', number: '**** 4532', blocked: false, limit: 1000 },
        { id: 'card2', type: 'credito', number: '**** 7891', blocked: false, limit: 3000 }
    ],
    transactions: [
        { id: 't1', date: Date.now() - 86400000, type: 'ingreso', amount: 500, to: 'acc1', desc: 'Ingreso inicial' },
        { id: 't2', date: Date.now() - 43200000, type: 'transferencia', amount: 200, from: 'acc1', to: 'acc2', desc: 'Ahorro mensual' }
    ]
};

let state = loadState();
let currentTab = 'home';

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
    } catch(e) {}
    return JSON.parse(JSON.stringify(defaultState));
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ==================== УТИЛИТЫ ====================
function formatMoney(n) {
    return n.toFixed(2).replace('.', ',') + ' €';
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

function getAccount(id) {
    return state.accounts.find(a => a.id === id);
}

function addTransaction(tx) {
    tx.id = 't' + Date.now() + Math.random().toString(36).slice(2,6);
    tx.date = Date.now();
    state.transactions.unshift(tx);
    if (state.transactions.length > 100) state.transactions.pop();
    saveState();
}

// ==================== НАВИГАЦИЯ ====================
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.footer-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
    });
    render();
}

function openProfile() {
    openModal(`
        <h2>👤 Perfil</h2>
        <label>Nombre</label>
        <input type="text" id="profileName" value="${state.user.name}">
        <label>Contraseña (demo)</label>
        <input type="password" value="••••••••" disabled>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveProfile()">Guardar</button>
        </div>
        <div style="margin-top:1rem; text-align:center;">
            <button class="btn btn-danger" style="font-size:0.8rem;" onclick="resetApp()">🗑️ Reiniciar datos</button>
        </div>
    `);
}

function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    if (name) {
        state.user.name = name;
        document.getElementById('userName').textContent = name;
        saveState();
        showToast('Perfil actualizado ✅');
    }
    closeModal();
}

function resetApp() {
    if (confirm('¿Reiniciar todos los datos?')) {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultState));
        saveState();
        closeModal();
        render();
        showToast('Datos reiniciados 🔄');
    }
}

// ==================== МОДАЛЬНЫЕ ОКНА ====================
function openModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
});

// ==================== ОПЕРАЦИИ ====================
function openAccount(accId) {
    const acc = getAccount(accId);
    if (!acc) return;
    openModal(`
        <h2>📂 ${acc.name}</h2>
        <div class="balance-badge">
            <span>Saldo disponible</span>
            <strong>${formatMoney(acc.balance)}</strong>
        </div>
        <label>Operación</label>
        <select id="opType">
            <option value="ingresar">💰 Ingresar dinero</option>
            <option value="retirar">💸 Retirar dinero</option>
            <option value="transferir">🔄 Transferir a otra cuenta</option>
        </select>
        <label>Importe (€)</label>
        <input type="number" id="opAmount" placeholder="0.00" min="0.01" step="0.01">
        <div id="destAccountWrap" style="display:none;">
            <label>Cuenta destino</label>
            <select id="destAccount">
                ${state.accounts.filter(a => a.id !== accId).map(a => 
                    `<option value="${a.id}">${a.name} (${formatMoney(a.balance)})</option>`
                ).join('')}
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="executeOp('${accId}')">Confirmar</button>
        </div>
    `);
    document.getElementById('opType').addEventListener('change', (e) => {
        document.getElementById('destAccountWrap').style.display = 
            e.target.value === 'transferir' ? 'block' : 'none';
    });
}

function executeOp(accId) {
    const acc = getAccount(accId);
    const type = document.getElementById('opType').value;
    const amount = parseFloat(document.getElementById('opAmount').value);
    if (!amount || amount <= 0) {
        showToast('⚠️ Importe inválido');
        return;
    }
    if (type === 'ingresar') {
        acc.balance += amount;
        addTransaction({ type: 'ingreso', amount, to: accId, desc: 'Ingreso en ' + acc.name });
        showToast(`✅ Ingresados ${formatMoney(amount)}`);
    } else if (type === 'retirar') {
        if (acc.balance < amount) { showToast('❌ Saldo insuficiente'); return; }
        acc.balance -= amount;
        addTransaction({ type: 'retiro', amount, from: accId, desc: 'Retiro de ' + acc.name });
        showToast(`✅ Retirados ${formatMoney(amount)}`);
    } else if (type === 'transferir') {
        const destId = document.getElementById('destAccount').value;
        const dest = getAccount(destId);
        if (!dest) { showToast('❌ Cuenta destino no encontrada'); return; }
        if (acc.balance < amount) { showToast('❌ Saldo insuficiente'); return; }
        acc.balance -= amount;
        dest.balance += amount;
        addTransaction({ type: 'transferencia', amount, from: accId, to: destId, 
            desc: `Transferencia de ${acc.name} a ${dest.name}` });
        showToast(`✅ Transferidos ${formatMoney(amount)} a ${dest.name}`);
    }
    saveState();
    closeModal();
    render();
}

function openNewAccount() {
    openModal(`
        <h2>➕ Nueva cuenta</h2>
        <label>Tipo de cuenta</label>
        <select id="newAccType">
            <option value="corriente">Cuenta corriente</option>
            <option value="ahorro">Cuenta de ahorro</option>
            <option value="nomina">Cuenta de nómina</option>
            <option value="vivienda">Cuenta vivienda</option>
        </select>
        <label>Depósito inicial (€)</label>
        <input type="number" id="newAccDeposit" placeholder="0.00" min="0" step="0.01" value="0">
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="createAccount()">Crear cuenta</button>
        </div>
    `);
}

function createAccount() {
    const type = document.getElementById('newAccType').value;
    const deposit = parseFloat(document.getElementById('newAccDeposit').value) || 0;
    const names = {
        corriente: 'Cuenta corriente',
        ahorro: 'Cuenta de ahorro',
        nomina: 'Cuenta de nómina',
        vivienda: 'Cuenta vivienda'
    };
    const newAcc = {
        id: 'acc' + Date.now(),
        type: type,
        name: names[type],
        balance: deposit
    };
    state.accounts.push(newAcc);
    if (deposit > 0) {
        addTransaction({ type: 'ingreso', amount: deposit, to: newAcc.id, desc: 'Apertura de ' + names[type] });
    }
    saveState();
    closeModal();
    render();
    showToast(`✅ ${names[type]} creada con ${formatMoney(deposit)}`);
}

function openTransfer() {
    if (state.accounts.length < 1) {
        showToast('⚠️ Crea al menos una cuenta');
        return;
    }
    const options = state.accounts.map(a => 
        `<option value="${a.id}">${a.name} (${formatMoney(a.balance)})</option>`
    ).join('');
    openModal(`
        <h2>🔄 Transferir dinero</h2>
        <label>Cuenta origen</label>
        <select id="fromAcc">${options}</select>
        <label>Cuenta destino</label>
        <select id="toAcc">${options}</select>
        <label>Importe (€)</label>
        <input type="number" id="transferAmount" placeholder="0.00" min="0.01" step="0.01">
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="doTransfer()">Transferir</button>
        </div>
    `);
}

function doTransfer() {
    const fromId = document.getElementById('fromAcc').value;
    const toId = document.getElementById('toAcc').value;
    const amount = parseFloat(document.getElementById('transferAmount').value);
    if (fromId === toId) { showToast('❌ Elige cuentas diferentes'); return; }
    if (!amount || amount <= 0) { showToast('⚠️ Importe inválido'); return; }
    const from = getAccount(fromId);
    const to = getAccount(toId);
    if (from.balance < amount) { showToast('❌ Saldo insuficiente'); return; }
    from.balance -= amount;
    to.balance += amount;
    addTransaction({ type: 'transferencia', amount, from: fromId, to: toId, 
        desc: `Transferencia de ${from.name} a ${to.name}` });
    saveState();
    closeModal();
    render();
    showToast(`✅ ${formatMoney(amount)} transferidos a ${to.name}`);
}

function openCards() {
    renderCardsModal();
}

function renderCardsModal() {
    const cardsHtml = state.cards.map(c => `
        <div class="account-card" style="background: ${c.type === 'credito' ? 'linear-gradient(135deg, #be185d, #ec4899)' : 'linear-gradient(135deg, #1e40af, #3b82f6)'}; margin-bottom: 10px; cursor: default;">
            <div class="acc-type">Tarjeta de ${c.type}</div>
            <div class="acc-balance" style="font-size: 1.2rem;">${c.number}</div>
            <div class="acc-label">Límite: ${formatMoney(c.limit)} · ${c.blocked ? '🔒 Bloqueada' : '✅ Activa'}</div>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button class="btn ${c.blocked ? 'btn-primary' : 'btn-danger'}" style="font-size:0.8rem; padding:0.5rem;" onclick="toggleCard('${c.id}')">
                ${c.blocked ? '🔓 Desbloquear' : '🔒 Bloquear'}
            </button>
            <button class="btn btn-secondary" style="font-size:0.8rem; padding:0.5rem;" onclick="payWithCard('${c.id}')">
                💳 Pagar
            </button>
        </div>
    `).join('');

    openModal(`
        <h2>💳 Mis tarjetas</h2>
        ${cardsHtml}
        <button class="btn btn-secondary" style="width:100%; margin-top:0.5rem;" onclick="closeModal()">Cerrar</button>
    `);
}

function toggleCard(cardId) {
    const card = state.cards.find(c => c.id === cardId);
    if (card) {
        card.blocked = !card.blocked;
        saveState();
        renderCardsModal();
        showToast(card.blocked ? '🔒 Tarjeta bloqueada' : '🔓 Tarjeta activada');
    }
}

function payWithCard(cardId) {
    const card = state.cards.find(c => c.id === cardId);
    if (card.blocked) { showToast('❌ Tarjeta bloqueada'); return; }
    openModal(`
        <h2>💳 Pago con tarjeta ${card.type}</h2>
        <label>Importe (€)</label>
        <input type="number" id="payAmount" placeholder="0.00" min="0.01" step="0.01">
        <label>Cuenta a debitar</label>
        <select id="payAccount">
            ${state.accounts.map(a => `<option value="${a.id}">${a.name} (${formatMoney(a.balance)})</option>`).join('')}
        </select>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="confirmPay('${cardId}')">Pagar</button>
        </div>
    `);
}

function confirmPay(cardId) {
    const amount = parseFloat(document.getElementById('payAmount').value);
    const accId = document.getElementById('payAccount').value;
    const acc = getAccount(accId);
    if (!amount || amount <= 0) { showToast('⚠️ Importe inválido'); return; }
    if (acc.balance < amount) { showToast('❌ Saldo insuficiente'); return; }
    acc.balance -= amount;
    addTransaction({ type: 'pago', amount, from: accId, desc: `Pago con tarjeta en ${acc.name}` });
    saveState();
    closeModal();
    render();
    showToast(`✅ Pago de ${formatMoney(amount)} realizado`);
}

// ==================== RENDER ====================
function render() {
    const el = document.getElementById('appContent');
    let html = '';

    if (currentTab === 'home') {
        html = renderHome();
    } else if (currentTab === 'accounts') {
        html = renderAccounts();
    } else if (currentTab === 'transfer') {
        html = renderTransferTab();
    } else if (currentTab === 'history') {
        html = renderHistory();
    } else if (currentTab === 'cards') {
        html = renderCardsTab();
    }
    el.innerHTML = html;
}

function renderHome() {
    const total = state.accounts.reduce((s, a) => s + a.balance, 0);
    return `
        <div class="section-title"><i>💰</i> Balance total</div>
        <div class="balance-badge" style="font-size:1rem;">
            <span>Patrimonio</span>
            <strong style="font-size:1.3rem; color:#1e40af;">${formatMoney(total)}</strong>
        </div>

        <div class="section-title"><i>📂</i> Mis cuentas</div>
        ${state.accounts.map(a => `
            <div class="account-card ${a.type}" onclick="openAccount('${a.id}')">
                <div class="acc-type">${a.name}</div>
                <div class="acc-balance">${formatMoney(a.balance)}</div>
                <div class="acc-label">Toca para operar</div>
            </div>
        `).join('')}
        <div class="card card-green" style="margin-top:8px;" onclick="openNewAccount()">
            <div class="icon">➕</div>
            Abrir nueva cuenta
        </div>

        <div class="section-title"><i>⚡</i> Acciones rápidas</div>
        <div class="action-list">
            <div class="action-item" onclick="openTransfer()">
                <span class="icon">🔄</span> Hacer una transferencia
            </div>
            <div class="action-item" onclick="openCards()">
                <span class="icon">💳</span> Gestionar tarjetas
            </div>
            <div class="action-item" onclick="switchTab('history')">
                <span class="icon">📜</span> Ver historial
            </div>
        </div>

        <div class="section-title"><i>🏛️</i> Servicios bancarios</div>
        <div class="grid-2">
            <div class="card card-yellow" onclick="showToast('Ventanilla: atención presencial')">
                <div class="icon">🪟</div> ventanilla
            </div>
            <div class="card card-orange" onclick="showToast('Cajero automático: retira o ingresa')">
                <div class="icon">🏧</div> cajero automático
            </div>
            <div class="card card-blue" onclick="showToast('Banco en línea: disponible 24/7')">
                <div class="icon">📱</div> en línea
            </div>
            <div class="card card-purple" onclick="showToast('Poder notarial: autoriza a terceros')">
                <div class="icon">📜</div> poder notarial
            </div>
        </div>
    `;
}

function renderAccounts() {
    return `
        <div class="section-title"><i>📂</i> Todas las cuentas</div>
        ${state.accounts.map(a => `
            <div class="account-card ${a.type}" onclick="openAccount('${a.id}')">
                <div class="acc-type">${a.name}</div>
                <div class="acc-balance">${formatMoney(a.balance)}</div>
                <div class="acc-label">Toca para ingresar, retirar o transferir</div>
            </div>
        `).join('')}
        <div class="card card-green" style="margin-top:8px;" onclick="openNewAccount()">
            <div class="icon">➕</div>
            Abrir nueva cuenta
        </div>
    `;
}

function renderTransferTab() {
    return `
        <div class="section-title"><i>🔄</i> Transferencias</div>
        <div class="action-list">
            <div class="action-item" onclick="openTransfer()">
                <span class="icon">💸</span> Entre mis cuentas
            </div>
            <div class="action-item" onclick="showToast('Función próximamente: transferencia a terceros')">
                <span class="icon">🌐</span> A otra persona
            </div>
        </div>
        <div class="section-title" style="margin-top:1.5rem;"><i>📋</i> Últimas transferencias</div>
        ${state.transactions.filter(t => t.type === 'transferencia').slice(0,5).map(t => `
            <div class="history-item">
                <div class="desc">
                    <span>${t.desc}</span>
                    <small>${new Date(t.date).toLocaleString('es-ES')}</small>
                </div>
                <div class="amount negative">-${formatMoney(t.amount)}</div>
            </div>
        `).join('') || '<div class="empty-state">No hay transferencias recientes</div>'}
    `;
}

function renderHistory() {
    return `
        <div class="section-title"><i>📜</i> Historial de operaciones</div>
        ${state.transactions.length === 0 ? '<div class="empty-state">No hay operaciones registradas</div>' : ''}
        ${state.transactions.map(t => {
            const isPositive = t.type === 'ingreso' || (t.type === 'transferencia' && t.to === t.from);
            let sign = '';
            if (t.type === 'ingreso') sign = '+';
            else if (t.type === 'retiro' || t.type === 'pago') sign = '-';
            else if (t.type === 'transferencia') sign = '↔';
            return `
                <div class="history-item">
                    <div class="desc">
                        <span>${t.desc || t.type}</span>
                        <small>${new Date(t.date).toLocaleString('es-ES')}</small>
                    </div>
                    <div class="amount ${t.type === 'ingreso' ? 'positive' : (t.type === 'retiro' || t.type === 'pago' ? 'negative' : '')}">
                        ${sign}${formatMoney(t.amount)}
                    </div>
                </div>
            `;
        }).join('')}
    `;
}

function renderCardsTab() {
    return `
        <div class="section-title"><i>💳</i> Mis tarjetas</div>
        ${state.cards.map(c => `
            <div class="account-card" style="background: ${c.type === 'credito' ? 'linear-gradient(135deg, #be185d, #ec4899)' : 'linear-gradient(135deg, #1e40af, #3b82f6)'}; cursor: default;">
                <div class="acc-type">Tarjeta de ${c.type}</div>
                <div class="acc-balance" style="font-size: 1.2rem;">${c.number}</div>
                <div class="acc-label">Límite: ${formatMoney(c.limit)} · ${c.blocked ? '🔒 Bloqueada' : '✅ Activa'}</div>
            </div>
        `).join('')}
        <div class="action-list" style="margin-top:10px;">
            <div class="action-item" onclick="openCards()">
                <span class="icon">⚙️</span> Gestionar tarjetas
            </div>
            <div class="action-item" onclick="showToast('Solicitar nueva tarjeta próximamente')">
                <span class="icon">➕</span> Solicitar nueva tarjeta
            </div>
        </div>
    `;
}

// ==================== ЧАСЫ ====================
function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = 
        now.getHours().toString().padStart(2,'0') + ':' + 
        now.getMinutes().toString().padStart(2,'0');
}
setInterval(updateClock, 10000);
updateClock();

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
document.getElementById('userName').textContent = state.user.name;
render();
</script>
</body>
</html>
